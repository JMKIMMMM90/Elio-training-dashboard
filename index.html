function buildSchedule() {
  const days = [];
  WEEKS.forEach((w, wi) => {
    w.dates.forEach((dateStr, di) => {
      const isLast = di === w.dates.length - 1;
      const tasks = [
        { id: "ppt", cat: "PPT", label: w.ppt },
        { id: "proj", cat: "프로젝트", label: `보고서 숙지 · ${w.project}` },
        { id: "book", cat: "도서", label: `독서 · 『${w.book}』` },
      ];
      const tests = [];
      if (isLast) {
        tests.push({ id: "report-ppt", cat: "제출", label: "PPT 과제 작성본 제출", time: "~ 오전 10시" });
        tests.push({ id: "report-book", cat: "제출", label: `독후감 제출 『${w.book}』`, time: "~ 오전 10시" });
        tests.push({ id: "test-proj", cat: "TEST", label: `프로젝트 서술형 TEST (${w.project})`, time: "오후 4시" });
        tests.push({ id: "test-book", cat: "TEST", label: `도서 퀴즈·서술형 TEST (${w.book})`, time: "오후 4시" });
        if (w.no === 4) tests.push({ id: "test-ppt", cat: "TEST", label: "PPT 테스트 (AI 활용)", time: "오후 4시" });
      }
      days.push({
        key: `w${w.no}d${di + 1}`,
        week: w.no,
        dayNo: wi * 5 + di + 1,
        date: dateStr,
        isLast,
        tasks: [...tasks, ...tests],
      });
    });
  });
  return days;
}

function fmtDate(dateStr) {

}

// "2026-09-01" → "26.9.1 입사"
function fmtJoin(d) {
  if (!d) return "";
  const p = d.split("-");
  if (p.length !== 3) return "";
  return `${p[0].slice(2)}.${+p[1]}.${+p[2]} 입사`;
}

function todayStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// 달력 그리드: 2026-08-30(일) ~ 2026-10-03(토), 5행 × 7열
function buildCalendarRows() {
  const rows = [];
  const start = new Date("2026-08-30T00:00:00");
  const p = (n) => String(n).padStart(2, "0");
  for (let r = 0; r < 5; r++) {
    const row = [];
    for (let c = 0; c < 7; c++) {
      const d = new Date(start);
      d.setDate(start.getDate() + r * 7 + c);
      const ds = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      row.push({ dateStr: ds, month: d.getMonth() + 1, day: d.getDate(), dow: c });
    }
    rows.push(row);
  }
  return rows;
}
const CAL_ROWS = buildCalendarRows();

// 예전 기기별 저장(localStorage) 키 — 최초 접속 시 온라인으로 1회 이전용
const STORAGE_KEY = "training-dashboard-2026";
const THEME_KEY = "training-dashboard-2026-theme";

// Firebase에서 온 목표 리스트를 배열로 정규화
const asList = (x) => (Array.isArray(x) ? x : x ? Object.values(x) : []);

// 목표 1건의 진척 (집계용, 100% 캡)
function goalProgress(g) {
  if (g.target > 0) return Math.min(1, (g.actual || 0) / g.target);
  return g.done ? 1 : 0;
}

// 목표 1건의 표시용 % (초과달성 그대로)
function goalRawPct(g) {
  if (g.target > 0) return Math.round(((g.actual || 0) / g.target) * 100);
  return g.done ? 100 : 0;
}

// 영역(PPT/프로젝트/도서) 점수: 목표가 있으면 목표 평균, 없으면 기존 체크
function areaScore(checks, goals, dayKey, areaId) {
  const list = asList(goals[dayKey] && goals[dayKey][areaId]);
  if (list.length === 0) return checks[`${dayKey}:${areaId}`] ? 1 : 0;
  return list.reduce((s, g) => s + goalProgress(g), 0) / list.length;
}

function taskScore(checks, goals, day, task) {
  if (AREA_IDS.includes(task.id)) return areaScore(checks, goals, day.key, task.id);
  return checks[`${day.key}:${task.id}`] ? 1 : 0;
}

// 주차 내 일별 수량 목표의 합 (upToDate를 주면 그 날짜까지의 계획 누적)
function sumTargets(goals, days, areaId, upToDate) {
  return days.reduce((s, d) => {
    if (upToDate && d.date > upToDate) return s;
    return s + asList(goals[d.key] && goals[d.key][areaId]).reduce((x, g) => x + (g.target > 0 ? g.target : 0), 0);
  }, 0);
}

// 주차 내 수량 목표의 실제 달성 합
function sumActuals(goals, days, areaId) {
  return days.reduce(
    (s, d) => s + asList(goals[d.key] && goals[d.key][areaId]).reduce((x, g) => x + (g.target > 0 ? g.actual || 0 : 0), 0),
    0
  );
}

// checks+goals로 주차별·전체 진행률 계산 (본인 화면·전체 현황 공용)
function calcStats(checks, goals) {
  goals = goals || {};
  const per = {};
  let allDone = 0,
    allTotal = 0;
  WEEKS.forEach((w) => {
    let done = 0,
      total = 0;
    SCHEDULE.filter((d) => d.week === w.no).forEach((d) => {
      d.tasks.forEach((t) => {
        total++;
        done += taskScore(checks, goals, d, t);
      });
    });
    per[w.no] = { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
    allDone += done;
    allTotal += total;
  });
  return {
    per,
    all: { done: allDone, total: allTotal, pct: allTotal ? Math.round((allDone / allTotal) * 100) : 0 },
  };
}

// 오늘이 속한(또는 다음) 주차
function currentWeekNo(today) {
  const d = DAY_BY_DATE[today];
  if (d) return d.week;
  if (today < SCHEDULE[0].date) return 1;
  if (today > SCHEDULE[SCHEDULE.length - 1].date) return 4;
  const next = SCHEDULE.find((x) => x.date >= today);
  return next ? next.week : 1;
}

  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem(THEME_KEY) || "light"; } catch { return "light"; }

  const switchTheme = () => {
    const next = theme === "dark" ? "light" : "dark";
    setTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch {}
  };

  if (!name) return <NamePicker T={THEMES[theme]} onPick={setName} />;

  return (
    <TrainingDashboard
      name={name}
      theme={theme}
      switchTheme={switchTheme}
      onChangeName={() => setName(null)}
    />
  );
}

// ── 전체 현황 (전원 진행률, 실시간) ────────────
function AllView({ T }) {
  const [users, setUsers] = useState(null);
  const [cfgAll, setCfgAll] = useState({});

  useEffect(() => {
    const ref = db.ref("users");
    const cb = ref.on(
      "value",
      (s) => setUsers(s.val() || {}),
      () => setUsers({})
    );
    const tRef = db.ref("config");
    const tCb = tRef.on("value", (s) => setCfgAll(s.val() || {}));
    return () => {
      ref.off("value", cb);
      tRef.off("value", tCb);
    };
  }, []);

  if (users === null)
    return (
      <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 8, padding: 24, textAlign: "center", color: T.faint, fontSize: 14 }}>
        불러오는 중…
      </div>
    );

  const today = todayStr();
  const todayD = DAY_BY_DATE[today] || null;
  const wkNo = currentWeekNo(today);
  const wkDays = SCHEDULE.filter((d) => d.week === wkNo);

  const staffAll = cfgAll.staff || {};
  const tw = (cfgAll.targets || {})["w" + wkNo] || {};
  const rows = Object.entries(users)
    .filter(([n]) => !ADMIN_NAMES.includes(n) && !staffAll[n])
    .map(([n, v]) => {
      const checks = (v && v.checks) || {};
      const goals = (v && v.goals) || {};
      const rv = (v && v.reviews) || {};
      const revSummary =
        Object.keys(rv).length > 0
          ? ["w1", "w2", "w3", "w4"].map((k) => (rv[k] && rv[k].score != null ? rv[k].score : "─")).join("·") +
            " | 종합 " +
            (rv.final && rv.final.score != null ? rv.final.score : "─")
          : null;
      const todayPct = todayD
        ? Math.round((todayD.tasks.reduce((s, t) => s + taskScore(checks, goals, todayD, t), 0) / todayD.tasks.length) * 100)
        : null;
      const planned = wkDays.some((d) => AREA_IDS.some((a) => asList(goals[d.key] && goals[d.key][a]).length > 0));
      // 총량이 설정된 영역의 이번 주 누적·페이스
      const areas = AREA_IDS.filter((a) => (tw[a] || 0) > 0).map((a) => {
        const actual = sumActuals(goals, wkDays, a);
        const planSum = sumTargets(goals, wkDays, a);
        const plannedUntil = sumTargets(goals, wkDays, a, today);
        return { a, target: tw[a], actual, planSum, diff: actual - plannedUntil };
      });
      return { name: n, rank: (v && v.rank) || "", mentor: (v && v.mentor) || "", joinDate: (v && v.joinDate) || "", revSummary, stats: calcStats(checks, goals), todayPct, planned, areas };
    })
    .sort((a, b) => b.stats.all.pct - a.stats.all.pct || a.name.localeCompare(b.name, "ko"));

  return (
    <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 8, padding: 18, boxShadow: T.shadow }}>
      <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 4 }}>전체 진행 현황</div>
      <div style={{ fontSize: 12.5, color: T.faint, marginBottom: 6 }}>총 {rows.length}명 · 체크하는 즉시 실시간으로 갱신돼요</div>
      {rows.length === 0 && (
        <div style={{ fontSize: 14, color: T.faint, padding: "12px 0" }}>아직 등록된 사람이 없어요.</div>
      )}
      {rows.map((r, i) => (
        <div key={r.name} style={{ padding: "13px 0", borderBottom: i === rows.length - 1 ? "none" : `1px solid ${T.line}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
            <span style={{ fontSize: 14.5, fontWeight: 700 }}>
              👤 {r.name}
              {r.rank ? ` ${r.rank}` : ""}
              {r.joinDate && <span style={{ fontSize: 12, fontWeight: 600, color: T.faint }}> ({fmtJoin(r.joinDate)})</span>}
              {r.mentor && <span style={{ fontSize: 12, fontWeight: 600, color: T.faint }}> · 담당 {r.mentor}</span>}
            </span>
            <span style={{ fontSize: 14, fontWeight: 800, color: r.stats.all.pct === 100 ? T.green : T.blue }}>
              {r.stats.all.pct}%{" "}
              <span style={{ fontSize: 11.5, fontWeight: 600, color: T.faint }}>
                ({Math.round(r.stats.all.done)}/{r.stats.all.total})
              </span>
            </span>
          </div>
          <div style={{ fontSize: 12, color: T.faint, marginBottom: 8 }}>
            {r.todayPct !== null && (
              <span>
                오늘{" "}
                <span style={{ fontWeight: 800, color: r.todayPct >= 100 ? T.green : r.todayPct > 0 ? T.blue : T.faint }}>
                  {r.todayPct}%
                </span>
                {" · "}
              </span>
            )}
            이번주 계획{" "}
            <span style={{ fontWeight: 800, color: r.planned ? T.green : T.orange }}>{r.planned ? "세움 ✓" : "아직"}</span>
          </div>
          {r.revSummary && (
            <div style={{ fontSize: 12, color: T.faint, marginBottom: 6 }}>
              평가 <span style={{ fontWeight: 800, color: T.sub }}>{r.revSummary}</span>
            </div>
          )}
          {r.areas.map((ai) => (
            <div key={ai.a} style={{ fontSize: 12, color: T.faint, marginBottom: 6 }}>
              {AREA_LABEL[ai.a]} 누적{" "}
              <span style={{ fontWeight: 800, color: ai.actual >= ai.target ? T.green : T.sub }}>
                {ai.actual}/{ai.target}
              </span>
              {" · "}
              {ai.planSum === 0 ? (
                <span style={{ fontWeight: 800, color: T.orange }}>계획 미입력</span>
              ) : (
                <span>
                  페이스{" "}
                  <span style={{ fontWeight: 800, color: ai.diff < 0 ? T.red : ai.diff > 0 ? T.green : T.sub }}>
                    {ai.diff < 0 ? `${ai.diff} ⚠️` : ai.diff > 0 ? `+${ai.diff} 🔥` : "✓"}
                  </span>
                </span>
              )}
            </div>
          ))}
          <Bar pct={r.stats.all.pct} h={8} T={T} />
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            {WEEKS.map((w) => (
              <div key={w.no} style={{ flex: 1, textAlign: "center", fontSize: 11.5, color: T.faint }}>
                {w.no}주{" "}
                <span style={{ fontWeight: 800, color: r.stats.per[w.no].pct === 100 ? T.green : T.sub }}>
                  {r.stats.per[w.no].pct}%
                </span>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function TrainingDashboard({ name, theme, switchTheme, onChangeName }) {
  const today = todayStr();
  const todayIdx = SCHEDULE.findIndex((d) => d.date === today);
  const defaultWeek = currentWeekNo(today);

  const T = THEMES[theme];
  const [view, setView] = useState("calendar"); // calendar | week | all
  const [week, setWeek] = useState(defaultWeek);
  const [checks, setChecks] = useState({});
  const [logs, setLogs] = useState({});
  const [goals, setGoals] = useState({});
  const [openDay, setOpenDay] = useState(todayIdx >= 0 ? SCHEDULE[todayIdx].key : null);
  const [addGoalFor, setAddGoalFor] = useState(null); // "dayKey:areaId"
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [cfg, setCfg] = useState({}); // config 전체: targets(총량)·weeks(과제명)·staff(담당자 명단)
  const [mentor, setMentor] = useState("");
  const [rank, setRank] = useState("");
  const [reviews, setReviews] = useState({});
  const targets = cfg.targets || {};
  const staff = cfg.staff || {};
  const wkList = useMemo(() => mergeWeeks(cfg.weeks), [cfg]);
  const isAdmin = ADMIN_NAMES.includes(name);
  const isStaff = isAdmin || !!staff[name];

  const CAT_STYLE = {
    PPT: { bg: T.blueSoft, fg: T.blue },
    프로젝트: { bg: T.w2Soft, fg: T.w2 },
    도서: { bg: T.purpleSoft, fg: T.purple },
    제출: { bg: T.orangeSoft, fg: T.orange },
    TEST: { bg: T.redSoft, fg: T.red },
  };

  // ── 내 데이터 실시간 구독 (다른 기기에서 바꿔도 즉시 반영) ──
  useEffect(() => {
    const ref = db.ref("users/" + name);
    let migrated = false;
    const cb = ref.on(
      "value",
      (snap) => {
        const v = snap.val();
        if (v) {
          setChecks(v.checks || {});
          setLogs(v.logs || {});
          setGoals(v.goals || {});
          setMentor(v.mentor || "");
          setRank(v.rank || "");
          setReviews(v.reviews || {});
        } else if (!migrated) {
          migrated = true;
          // 예전 기기별 저장(localStorage) 기록이 있으면 온라인으로 1회 이전
          let old = null;
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) old = JSON.parse(raw);
          } catch {}
          if (old && (old.checks || old.logs)) {
            ref.set({ checks: old.checks || {}, logs: old.logs || {}, joinedAt: Date.now() })
              .catch(() => setSaveState("error"));
            return; // 저장되면 구독이 다시 호출된다
          }
          // 새 이름 등록 (전체 현황·이름 목록에 나타나도록)
          ref.child("joinedAt").set(Date.now()).catch(() => setSaveState("error"));
          setChecks({});
          setLogs({});
          setGoals({});
          setMentor("");
          setRank("");
          setReviews({});
        }
        setLoaded(true);
      },
      () => {
        setSaveState("error");
        setLoaded(true);
      }
    );
    return () => ref.off("value", cb);
  }, [name]);

  // 설정(총량·과제명·담당자 명단) 실시간 구독
  useEffect(() => {
    const ref = db.ref("config");
    const cb = ref.on("value", (s) => setCfg(s.val() || {}));
    return () => ref.off("value", cb);
  }, []);

  const toggleTask = (dayKey, taskId) => {
    const k = `${dayKey}:${taskId}`;
    const next = !checks[k];
    setChecks({ ...checks, [k]: next });
    setSaveState("saving");
    db.ref(`users/${name}/checks/${k}`)
      .set(next)
      .then(() => setSaveState("idle"))
      .catch(() => setSaveState("error"));
  };

  // ── 하루 목표 (goals) ──
  const saveGoals = (dayKey, areaId, list) => {
    setGoals({ ...goals, [dayKey]: { ...(goals[dayKey] || {}), [areaId]: list } });
    setSaveState("saving");
    db.ref(`users/${name}/goals/${dayKey}/${areaId}`)
      .set(list)
      .then(() => setSaveState("idle"))
      .catch(() => setSaveState("error"));
  };

  const addGoal = (dayKey, areaId, text, target) => {
    const list = [...asList(goals[dayKey] && goals[dayKey][areaId])];
    list.push(target > 0 ? { text, target, actual: 0 } : { text, done: false });
    saveGoals(dayKey, areaId, list);
  };

  const toggleGoal = (dayKey, areaId, idx) => {
    const list = [...asList(goals[dayKey] && goals[dayKey][areaId])];
    list[idx] = { ...list[idx], done: !list[idx].done };
    saveGoals(dayKey, areaId, list);
  };

  const setGoalActual = (dayKey, areaId, idx, actual) => {
    const list = [...asList(goals[dayKey] && goals[dayKey][areaId])];
    list[idx] = { ...list[idx], actual };
    saveGoals(dayKey, areaId, list);
  };

  const updateGoal = (dayKey, areaId, idx, patch) => {
    const list = [...asList(goals[dayKey] && goals[dayKey][areaId])];
    list[idx] = { ...list[idx], ...patch };
    saveGoals(dayKey, areaId, list);
  };

  const removeGoal = (dayKey, areaId, idx) => {
    const list = asList(goals[dayKey] && goals[dayKey][areaId]).filter((_, i) => i !== idx);
    saveGoals(dayKey, areaId, list);
  };

  const saveLogs = (dayKey, list) => {
    setSaveState("saving");
    db.ref(`users/${name}/logs/${dayKey}`)
      .set(list)
      .then(() => setSaveState("idle"))
      .catch(() => setSaveState("error"));
  };

  const addLog = (dayKey, start, end, text) => {
    if (!text.trim()) return;
    const list = logs[dayKey] ? [...logs[dayKey]] : [];
    list.push({ time: start || "--:--", end: end || null, text: text.trim() });
    list.sort((a, b) => a.time.localeCompare(b.time));
    setLogs({ ...logs, [dayKey]: list });
    saveLogs(dayKey, list);
  };

  const removeLog = (dayKey, idx) => {
    const list = logs[dayKey].filter((_, i) => i !== idx);
    setLogs({ ...logs, [dayKey]: list });
    saveLogs(dayKey, list);
  };

  const updateLog = (dayKey, idx, entry) => {
    const list = [...(logs[dayKey] || [])];
    list[idx] = entry;
    list.sort((a, b) => a.time.localeCompare(b.time));
    setLogs({ ...logs, [dayKey]: list });
    saveLogs(dayKey, list);
  };

  // ── 진행률 ──
  const stats = useMemo(() => calcStats(checks, goals), [checks, goals]);

  const dayDoneMap = useMemo(() => {
    const m = {};
    SCHEDULE.forEach((d) => {
      let doneCount = 0;
      d.tasks.forEach((t) => {
        if (taskScore(checks, goals, d, t) >= 0.999) doneCount++;
      });
      m[d.key] = { done: doneCount, total: d.tasks.length, complete: doneCount === d.tasks.length };
    });
    return m;
  }, [checks, goals]);

  const goDay = (dateStr) => {
    const d = DAY_BY_DATE[dateStr];
    if (!d) return;
    setWeek(d.week);
    setOpenDay(d.key);
    setView("week");
  };

  const curWeek = wkList.find((w) => w.no === week);
  const curDays = SCHEDULE.filter((d) => d.week === week);
  const weekHasPlan = curDays.some((d) => AREA_IDS.some((a) => asList(goals[d.key] && goals[d.key][a]).length > 0));

  const card = (mt = 0) => ({
    background: T.card,
    border: `1px solid ${T.line}`,
    borderRadius: 8,
    padding: 18,
    marginTop: mt,
    boxShadow: T.shadow,
  });

  if (!loaded)
    return (
      <div style={{ fontFamily: FONT, background: T.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: T.faint, fontSize: 15 }}>
        불러오는 중…
      </div>
    );

  return (
    <div style={{ fontFamily: FONT, background: T.bg, minHeight: "100vh", color: T.text, transition: "background .2s" }}>
      <div style={{ maxWidth: 720, margin: "0 auto", padding: "28px 16px 80px" }}>
        {/* ── 헤더 ── */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "4px 4px 20px" }}>
          <div>
            <div style={{ fontSize: 13, color: T.orange, fontWeight: 700, letterSpacing: "0.01em", marginBottom: 5 }}>
              Elio INITIAN Training Program · 2026.9.2(수) ~ 10.1(목)
            </div>
            <div style={{ fontSize: 22, fontWeight: 800, letterSpacing: "-0.01em", lineHeight: 1.3 }}>
              {rank ? `${name} ${rank}` : `${name}님`}, 지금 <span style={{ color: T.blue }}>{stats.all.pct}%</span> 왔어요
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end", flexShrink: 0 }}>
            <button
              onClick={switchTheme}
              aria-label="테마 전환"
              style={{
                border: `1px solid ${T.line}`,
                cursor: "pointer",
                fontFamily: FONT,
                fontSize: 13,
                fontWeight: 700,
                padding: "7px 12px",
                borderRadius: 999,
                background: T.card,
                color: T.sub,
              }}
            >
              {theme === "dark" ? "☀️ 라이트" : "🌙 다크"}
            </button>
            <button
              onClick={onChangeName}
              style={{
                border: "none",
                cursor: "pointer",
                fontFamily: FONT,
                fontSize: 12,
                fontWeight: 600,
                padding: "5px 8px",
                borderRadius: 8,
                background: "transparent",
                color: T.faint,
              }}
            >
              👤 이름 변경
            </button>
          </div>
        </div>

        {/* ── 전체 진행률 ── */}
        <div style={card()}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
            <span style={{ fontSize: 15, fontWeight: 800 }}>Road to INITIAN</span>
            <span style={{ fontSize: 13, color: T.faint }}>{Math.round(stats.all.done)} / {stats.all.total} 완료</span>
          </div>
          <Bar pct={stats.all.pct} h={10} T={T} />
          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            {WEEKS.map((w) => (
              <div key={w.no} style={{ flex: 1, textAlign: "center" }}>
                <div style={{ fontSize: 12, color: T[WEEK_COLOR[w.no]], fontWeight: 700, marginBottom: 2 }}>{w.no}주차</div>
                <div style={{ fontSize: 11, color: T.faint, marginBottom: 4 }}>{w.range.replace(/\([^)]*\)/g, "")}</div>
                <div style={{ fontSize: 15, fontWeight: 800, color: stats.per[w.no].pct === 100 ? T.green : T.text }}>
                  {stats.per[w.no].pct}%
                </div>
              </div>

                                      T={T}
                                      accent={cs.fg}
                                      onToggle={() => toggleGoal(d.key, t.id, gi)}
                                      onActual={(n) => setGoalActual(d.key, t.id, gi, n)}
                                      onUpdate={(patch) => updateGoal(d.key, t.id, gi, patch)}
                                      onRemove={() => removeGoal(d.key, t.id, gi)}
                                    />
                                  ))}
                                </div>
                              )}

                              {addGoalFor === addKey && (
                                <AddGoalRow T={T} onAdd={(text, target) => addGoal(d.key, t.id, text, target)} />
                              )}
                            </div>
                          );
                        })}

                        <div style={{ fontSize: 13, fontWeight: 700, color: T.sub, margin: "16px 0 8px" }}>일과표</div>
                        {dayLogs.length === 0 && (
                          <div style={{ fontSize: 13, color: T.faint, padding: "4px 2px 8px" }}>
                            아직 기록이 없어요. 아래에서 오늘 한 일을 시간과 함께 남겨보세요.
                          </div>
                        )}
                        {dayLogs.map((l, i) => (
                          <LogRow
                            key={i}
                            l={l}
                            T={T}
                            onUpdate={(entry) => updateLog(d.key, i, entry)}
                            onRemove={() => removeLog(d.key, i)}
                          />
                        ))}
                        <LogInput onAdd={(start, end, text) => addLog(d.key, start, end, text)} T={T} />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}

        {/* ══════════ 전체 현황 뷰 ══════════ */}
        {view === "all" && <AllView T={T} />}

        {/* ══════════ 평가 입력 (담당자·관리자) ══════════ */}
        {view === "review" && isStaff && <ReviewPanel T={T} me={name} setSaveState={setSaveState} />}

        {/* ══════════ 관리 센터 (관리자 전용) ══════════ */}
        {view === "settings" && isAdmin && (
          <AdminPanel T={T} targets={targets} weeks={wkList} staff={staff} setSaveState={setSaveState} />
        )}

        {saveState === "error" && (
          <div style={{ marginTop: 16, padding: "12px 14px", borderRadius: 8, background: T.redSoft, color: T.red, fontSize: 13, fontWeight: 600 }}>
            저장에 실패했어요. 인터넷 연결을 확인한 뒤 다시 체크해 주세요.
          </div>
        )}

        <div style={{ marginTop: 28, textAlign: "center", fontSize: 12, color: T.faint, lineHeight: 1.7 }}>
          체크·목표·일과 기록은 온라인에 자동 저장돼요 — 어느 기기에서 접속해도 같은 기록이 보여요
          <br />
          제출물(PPT 작성본·독후감): 매주 마지막 날 오전 10시까지 · TEST: 매주 마지막 날 오후 4시
        </div>
      </div>
    </div>
  );
}

// 자유 텍스트 입력 (칸 밖 클릭/Enter 시 저장)
function TextCommit({ T, value, placeholder, onCommit, small }) {
  const [v, setV] = useState(value || "");
  useEffect(() => setV(value || ""), [value]);
  const commit = () => {
    const t = v.trim();
    if (t !== (value || "")) onCommit(t);
  };
  return (
    <input
      type="text"
      value={v}
      placeholder={placeholder}
      onChange={(e) => setV(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
      style={{
        flex: 1,
        minWidth: 0,
        fontFamily: FONT,
        fontSize: small ? 13 : 14,
        fontWeight: 600,
        border: `1.5px solid ${T.inputBorder}`,
        borderRadius: 8,
        padding: small ? "7px 9px" : "9px 10px",
        background: T.cardSoft,
        color: T.text,
        outline: "none",
      }}
    />
  );
}

// 점수 입력 (0~10, 비우면 평가 취소)
function ScoreInput({ T, value, onCommit }) {
  const has = value !== null && value !== undefined;
  const [v, setV] = useState(has ? String(value) : "");
  useEffect(() => {
    setV(value !== null && value !== undefined ? String(value) : "");
  }, [value]);
  const commit = () => {
    if (v.trim() === "") {
      if (has) onCommit(null);
      return;
    }
    let n = parseInt(v, 10);
    if (isNaN(n)) {
      setV(has ? String(value) : "");
      return;
    }
    n = Math.max(0, Math.min(10, n));
    setV(String(n));
    if (n !== value) onCommit(n);
  };
  return (
    <input
      type="number"
      min="0"
      max="10"
      value={v}
      placeholder="—"
      onChange={(e) => setV(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
      style={{
        width: 60,
        fontFamily: FONT,
        fontSize: 14,
        fontWeight: 800,
        textAlign: "center",
        border: `1.5px solid ${T.inputBorder}`,
        borderRadius: 8,
        padding: "7px 2px",
        background: T.cardSoft,
        color: T.text,
        outline: "none",
        flexShrink: 0,
      }}
    />
  );
}

// 코멘트 입력 (칸 밖 클릭 시 저장)
function CommentInput({ T, value, onCommit }) {
  const [v, setV] = useState(value);
  useEffect(() => setV(value), [value]);
  const commit = () => {
    if (v.trim() !== (value || "")) onCommit(v.trim() || null);
  };
  return (
    <textarea
      value={v}
      placeholder="코멘트 (신입 본인에게 보여요)"
      onChange={(e) => setV(e.target.value)}
      onBlur={commit}
      style={{
        width: "100%",
        minHeight: 54,
        resize: "vertical",
        fontFamily: FONT,
        fontSize: 13.5,
        lineHeight: 1.6,
        border: `1.5px solid ${T.inputBorder}`,
        borderRadius: 8,
        padding: "9px 11px",
        background: T.cardSoft,
        color: T.text,
        outline: "none",
      }}
    />
  );
}

// 총량 입력 칸 (비우면 해당 영역 목표 없음)
function TargetInput({ T, value, onCommit }) {
  const [v, setV] = useState(value > 0 ? String(value) : "");
  useEffect(() => setV(value > 0 ? String(value) : ""), [value]);
  const commit = () => {
    const n = Math.max(0, parseInt(v, 10) || 0);
    setV(n > 0 ? String(n) : "");
    if (n !== value) onCommit(n);
  };
  return (
    <input
      type="number"
      min="0"
      value={v}
      placeholder="—"
      onChange={(e) => setV(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
      style={{
        flex: 1,
        minWidth: 0,
        fontFamily: FONT,
        fontSize: 14,
        fontWeight: 700,
        textAlign: "center",
        border: `1.5px solid ${T.inputBorder}`,
        borderRadius: 8,
        padding: "9px 4px",
        background: T.cardSoft,
        color: T.text,
        outline: "none",
      }}
    />
  );
}

function CheckBox({ on, T }) {
  return (
    <span
      style={{
        width: 22,
        height: 22,
        borderRadius: 8,
        flexShrink: 0,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        background: on ? T.blue : "transparent",
        border: on ? "none" : `1.5px solid ${T.checkOff}`,
        color: "#fff",
        fontSize: 12,
        fontWeight: 800,
      }}
    >
      {on ? "✓" : ""}
    </span>
  );
}

// 하루 목표 한 줄: 수량형(목표수 있음)은 달성 수 입력, 체크형은 체크. ✏️로 내용·목표수 수정.
function GoalRow({ g, T, accent, onToggle, onActual, onUpdate, onRemove }) {
  const isCount = g.target > 0;
  const pct = goalRawPct(g);
  const [editing, setEditing] = useState(false);
  const [et, setEt] = useState("");
  const [etg, setEtg] = useState("");

  const startEdit = () => {
    setEt(g.text);
    setEtg(isCount ? String(g.target) : "");
    setEditing(true);
  };
  const saveEdit = () => {
    const t = et.trim();
    if (!t) return;
    const patch = { text: t };
    if (isCount) patch.target = Math.max(1, parseInt(etg, 10) || g.target);
    onUpdate(patch);
    setEditing(false);
  };

  const editInputStyle = {
    fontFamily: FONT,
    fontSize: 13.5,
    border: `1.5px solid ${T.inputBorder}`,
    borderRadius: 8,
    padding: "7px 9px",
    background: T.card,
    color: T.text,
    outline: "none",
  };

  if (editing)
    return (
      <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 6, padding: "7px 0 7px 2px", borderTop: `1px solid ${T.line}` }}>
        <input
          type="text"
          value={et}
          onChange={(e) => setEt(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && saveEdit()}
          style={{ ...editInputStyle, flex: 1, minWidth: 120 }}
        />
        {isCount && (
          <input
            type="number"
            min="1"
            value={etg}
            onChange={(e) => setEtg(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && saveEdit()}
            style={{ ...editInputStyle, width: 62, textAlign: "center", flexShrink: 0 }}
          />
        )}
        <button
          onClick={saveEdit}
          style={{ fontFamily: FONT, fontSize: 12.5, fontWeight: 700, border: "none", borderRadius: 8, padding: "7px 11px", background: T.blue, color: "#fff", cursor: "pointer", flexShrink: 0 }}
        >
          저장
        </button>
        <button
          onClick={() => setEditing(false)}
          style={{ fontFamily: FONT, fontSize: 12.5, fontWeight: 700, border: "none", borderRadius: 8, padding: "7px 9px", background: "transparent", color: T.faint, cursor: "pointer", flexShrink: 0 }}
        >
          취소
        </button>
      </div>
    );

  return (
    <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8, padding: "7px 0 7px 2px", borderTop: `1px solid ${T.line}` }}>
      {isCount ? (
        <>
          <span style={{ fontSize: 13.5, fontWeight: 600, flex: 1, minWidth: 140, lineHeight: 1.4, color: pct >= 100 ? T.faint : T.text }}>
            {g.text}
          </span>
          <span style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0, marginLeft: "auto" }}>
            <CountInput value={g.actual || 0} onCommit={onActual} T={T} />
            <span style={{ fontSize: 12.5, color: T.faint }}>/ {g.target}</span>
            <span
              style={{
                fontSize: 12,
                fontWeight: 800,
                minWidth: 44,
                textAlign: "right",
                color: pct > 100 ? T.orange : pct >= 100 ? T.green : accent,
              }}
            >
              {pct > 100 ? `${pct}% 🔥초과` : `${pct}%`}
            </span>
          </span>
        </>
      ) : (
        <>
          <button
            onClick={onToggle}
            aria-label="목표 체크"
            style={{ border: "none", background: "transparent", cursor: "pointer", padding: 0, display: "flex", flexShrink: 0 }}
          >
            <CheckBox on={!!g.done} T={T} />
          </button>
          <span
            style={{
              fontSize: 13.5,
              fontWeight: 600,
              flex: 1,
              minWidth: 0,
              lineHeight: 1.4,
              color: g.done ? T.faint : T.text,
              textDecoration: g.done ? "line-through" : "none",
            }}
          >
            {g.text}
          </span>
          <span style={{ fontSize: 12, fontWeight: 800, flexShrink: 0, color: g.done ? T.green : T.faint }}>
            {g.done ? "완료" : ""}
          </span>
        </>
      )}
      <button
        onClick={startEdit}
        style={{ border: "none", background: "transparent", color: T.sub, cursor: "pointer", fontSize: 12, fontWeight: 700, padding: "4px 3px", flexShrink: 0, textDecoration: "underline", textUnderlineOffset: 2 }}
      >
        수정
      </button>
      <button
        onClick={onRemove}
        style={{ border: "none", background: "transparent", color: T.faint, cursor: "pointer", fontSize: 12, fontWeight: 700, padding: "4px 3px", flexShrink: 0, textDecoration: "underline", textUnderlineOffset: 2 }}
      >
        삭제
      </button>
    </div>
  );
}

// 수량형 달성 수 입력 (입력 후 포커스가 빠지거나 Enter 치면 저장)
function CountInput({ value, onCommit, T }) {
  const [v, setV] = useState(String(value));
  useEffect(() => setV(String(value)), [value]);
  const commit = () => {
    const n = Math.max(0, parseInt(v, 10) || 0);
    setV(String(n));
    if (n !== value) onCommit(n);
  };
  return (
    <input
      type="number"
      min="0"
      value={v}
      onChange={(e) => setV(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
      style={{
        width: 54,
        fontFamily: FONT,
        fontSize: 13.5,
        fontWeight: 700,
        textAlign: "center",
        border: `1.5px solid ${T.inputBorder}`,
        borderRadius: 8,
        padding: "5px 2px",
        background: T.card,
        color: T.text,
        outline: "none",
        flexShrink: 0,
      }}
    />
  );
}

// 목표 추가 입력: 목표수를 넣으면 수량형, 비우면 체크형
function AddGoalRow({ T, onAdd }) {
  const [text, setText] = useState("");
  const [target, setTarget] = useState("");
  const submit = () => {
    if (!text.trim()) return;
    onAdd(text.trim(), Math.max(0, parseInt(target, 10) || 0));
    setText("");
    setTarget("");
  };
  const inputStyle = {
    fontFamily: FONT,
    fontSize: 13.5,
    border: `1.5px solid ${T.inputBorder}`,
    borderRadius: 8,
    padding: "8px 10px",
    background: T.card,
    color: T.text,
    outline: "none",
  };
  return (
    <div style={{ marginTop: 8 }}>
      <div style={{ display: "flex", gap: 6 }}>
        <input
          type="text"
          value={text}
          placeholder="목표 내용 (예: 장표 쉐도잉)"
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          style={{ ...inputStyle, flex: 1, minWidth: 0 }}
        />
        <input
          type="number"
          min="1"
          value={target}
          placeholder="목표수"
          onChange={(e) => setTarget(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          style={{ ...inputStyle, width: 68, textAlign: "center", flexShrink: 0 }}
        />
        <button
          onClick={submit}
          style={{
            fontFamily: FONT,
            fontSize: 13.5,
            fontWeight: 700,
            border: "none",
            borderRadius: 8,
            padding: "8px 13px",
            background: T.blue,
            color: "#fff",
            cursor: "pointer",
            flexShrink: 0,
          }}
        >
          추가
        </button>
      </div>
      <div style={{ fontSize: 11.5, color: T.faint, marginTop: 5, paddingLeft: 2, lineHeight: 1.5 }}>
        목표수를 넣으면 수량으로(예: 40/30 = 133% 초과달성), 비우면 체크로 기록돼요
      </div>
    </div>
  );
}

function Bar({ pct, h = 8, T }) {
  return (
    <div style={{ width: "100%", height: h, borderRadius: h, background: T.cardSoft, overflow: "hidden" }}>
      <div style={{ width: `${Math.min(100, pct)}%`, height: "100%", borderRadius: h, background: pct >= 100 ? T.green : T.blue, transition: "width .3s ease" }} />
    </div>
  );
}

function Chip({ bg, fg, children }) {
  return (
    <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 8px", borderRadius: 8, background: bg, color: fg, flexShrink: 0 }}>
      {children}
    </span>
  );
}

function SummaryRow({ cat, text, last, CAT_STYLE, T }) {
  const cs = CAT_STYLE[cat];
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 0", borderBottom: last ? "none" : `1px solid ${T.line}` }}>
      <Chip bg={cs.bg} fg={cs.fg}>{cat}</Chip>
      <span style={{ fontSize: 14, fontWeight: 600, lineHeight: 1.4 }}>{text}</span>
    </div>
  );
}

// 일과 한 줄: "수정"으로 시작·마감 시간과 내용을 인라인 수정
function LogRow({ l, T, onUpdate, onRemove }) {
  const [editing, setEditing] = useState(false);
  const [start, setStart] = useState("");
  const [end, setEnd] = useState("");
  const [text, setText] = useState("");

  const startEdit = () => {
    setStart(l.time === "--:--" ? "" : l.time);
    setEnd(l.end || "");
    setText(l.text);
    setEditing(true);
  };
  const saveEdit = () => {
    if (!text.trim()) return;
    onUpdate({ time: start || "--:--", end: end || null, text: text.trim() });
    setEditing(false);
  };

  const inputStyle = {
    fontFamily: FONT,
    fontSize: 13.5,
    border: `1.5px solid ${T.inputBorder}`,
    borderRadius: 8,
    padding: "7px 9px",
    background: T.cardSoft,
    color: T.text,
    outline: "none",
  };
  const linkBtn = (color) => ({
    border: "none",
    background: "transparent",
    color,
    cursor: "pointer",
    fontSize: 12,
    fontWeight: 700,
    padding: "4px 3px",
    flexShrink: 0,
    textDecoration: "underline",
    textUnderlineOffset: 2,
  });

  if (editing)
    return (
      <div style={{ padding: "8px 0", borderBottom: `1px solid ${T.line}` }}>
        <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6 }}>
          <input type="time" value={start} onChange={(e) => setStart(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 0, colorScheme: "dark light" }} />
          <span style={{ fontSize: 12, color: T.faint, fontWeight: 700 }}>~</span>
          <input type="time" value={end} onChange={(e) => setEnd(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 0, colorScheme: "dark light" }} />
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <input
            type="text"
            value={text}
            onChange={(e) => setText(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && saveEdit()}
            style={{ ...inputStyle, flex: 1, minWidth: 0 }}
          />
          <button
            onClick={saveEdit}
            style={{ fontFamily: FONT, fontSize: 12.5, fontWeight: 700, border: "none", borderRadius: 8, padding: "7px 11px", background: T.blue, color: "#fff", cursor: "pointer", flexShrink: 0 }}
          >
            저장
          </button>
          <button
            onClick={() => setEditing(false)}
            style={{ fontFamily: FONT, fontSize: 12.5, fontWeight: 700, border: "none", borderRadius: 8, padding: "7px 9px", background: "transparent", color: T.faint, cursor: "pointer", flexShrink: 0 }}
          >
            취소
          </button>
        </div>
      </div>
    );

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 2px", borderBottom: `1px solid ${T.line}` }}>
      <span style={{ fontSize: 12.5, fontWeight: 700, color: T.blue, width: l.end ? 92 : 46, flexShrink: 0 }}>
        {l.time}
        {l.end ? ` ~ ${l.end}` : ""}
      </span>
      <span style={{ fontSize: 14, flex: 1, lineHeight: 1.5 }}>{l.text}</span>
      <button onClick={startEdit} style={linkBtn(T.sub)}>수정</button>
      <button onClick={onRemove} style={linkBtn(T.faint)}>삭제</button>
    </div>
  );
}

function LogInput({ onAdd, T }) {
  const [start, setStart] = useState("");
  const [end, setEnd] = useState("");
  const [text, setText] = useState("");
  const submit = () => {
    if (!text.trim()) return;
    onAdd(start, end, text);
    setStart("");
    setEnd("");
    setText("");
  };
  const inputStyle = {
    fontFamily: FONT,
    fontSize: 14,
    border: `1.5px solid ${T.inputBorder}`,
    borderRadius: 8,
    padding: "10px 10px",
    background: T.cardSoft,
    color: T.text,
    outline: "none",
  };
  const labelStyle = { fontSize: 12, fontWeight: 700, color: T.faint, flexShrink: 0 };
  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
        <span style={labelStyle}>시작</span>
        <input type="time" value={start} onChange={(e) => setStart(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 0, colorScheme: "dark light" }} />
        <span style={labelStyle}>마감</span>
        <input type="time" value={end} onChange={(e) => setEnd(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 0, colorScheme: "dark light" }} />
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <input
          type="text"
          value={text}
          placeholder="한 일을 입력하세요"
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          style={{ ...inputStyle, flex: 1, minWidth: 0, padding: "10px 12px" }}
        />
        <button
          onClick={submit}
          style={{
            fontFamily: FONT,
            fontSize: 14,
            fontWeight: 700,
            border: "none",
            borderRadius: 8,
            padding: "10px 16px",
            background: T.blue,
            color: "#fff",
            cursor: "pointer",
            flexShrink: 0,
          }}
        >
          추가
        </button>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
